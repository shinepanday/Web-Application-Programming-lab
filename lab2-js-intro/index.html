<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAB2 - JS Basics</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .body {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 15px 20px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h3 {
      margin-bottom: 10px;
      color: #444;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: #555;
    }
  </style>

</head>
<body>

  <div class="body">
    <h1>JavaScript LAB2 Demo</h1>

    <button onclick="showAll()">Show Results</button>

    <div class="card">
      <h3>Variables</h3>
      <p id="varSection"></p>
    </div>

    <div class="card">
      <h3>Functions</h3>
      <p id="funcSection"></p>
    </div>

    <div class="card">
      <h3>Object</h3>
      <p id="objSection"></p>
    </div>

    <div class="card">
      <h3>Array Methods</h3>
      <p id="arrSection"></p>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
